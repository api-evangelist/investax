aid: investax
name: InvestaX
description: >-
  InvestaX is a Singapore-based, MAS-licensed tokenization platform for real-world assets (RWAs),
  operated by IC SG Pte. Ltd. under a Capital Markets Services license (CMS100635) and a Recognised
  Market Operator license from the Monetary Authority of Singapore. The platform provides end-to-end
  infrastructure for the issuance, distribution, secondary trading, and custody of security tokens and
  tokenized securities, plus a Tokenization SaaS product for institutional issuers and RWA investment
  products such as tokenized money market funds and private credit. It supports multiple blockchain
  protocols including Ethereum, Polygon, BASE, Algorand, Tezos, and Hedera. Backed by 500 Global.
